<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaSolDB viewer (preview, made-up data)</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f0f2f6; --text: #31333f; --muted: #6b6f7b; --line: #e6e8ee;
    --accent: #ff4b4b; --accent-soft: #ffe3e3; --sel: #e8f0fe; --radius: 8px;
    --font: "Source Sans Pro", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font);
               font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
  .banner { background: #fff6d6; border-bottom: 1px solid #f1df9c; color: #5c4a00; font-size: 14px;
            padding: 8px 16px; text-align: center; }
  .shell { display: flex; min-height: calc(100vh - 38px); }
  /* left filter panel (Streamlit sidebar look) */
  aside { width: 300px; flex: 0 0 300px; background: var(--panel); padding: 20px 18px 40px; border-right: 1px solid var(--line); }
  aside h2 { font-size: 18px; margin: 0 0 4px; }
  aside .tabname { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .filters-toggle { display: none; }
  main { flex: 1 1 auto; min-width: 0; padding: 24px 32px 60px; max-width: 1200px; }
  h1 { font-size: 34px; font-weight: 700; margin: 6px 0 4px; letter-spacing: -0.5px; }
  .caption { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }
  /* tabs */
  .tabs { display: flex; gap: 2px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--line);
          -webkit-overflow-scrolling: touch; scrollbar-width: thin; margin-bottom: 16px; }
  .tabs button { flex: 0 0 auto; background: none; border: none; border-bottom: 3px solid transparent;
                 font: inherit; font-size: 15px; color: var(--text); padding: 10px 14px; min-height: 44px; cursor: pointer; }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  /* widgets */
  .field { margin-bottom: 16px; }
  .field > label, .field .lbl { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-bottom: 6px; }
  .help { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin: -9px 0;
          border: none; background: none; cursor: pointer; padding: 0; }
  .help span { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%;
               border: 1px solid #b9bcc6; font-size: 12px; color: var(--muted); background: #fff; }
  .helptext { display: none; font-size: 13px; color: var(--muted); background: #fff; border: 1px solid var(--line);
              border-radius: 6px; padding: 6px 8px; margin: -2px 0 8px; }
  .helptext.open { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: #fff; border: 1px solid #d5d8e0; border-radius: 20px; padding: 0 12px; min-height: 40px;
          font: inherit; font-size: 14px; color: var(--text); cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .range-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .range-row span.v { min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
  input[type=range] { flex: 1; accent-color: var(--accent); height: 40px; }
  .check { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }
  input[type=text] { width: 100%; font: inherit; padding: 8px 10px; min-height: 42px; border: 1px solid #d5d8e0;
                     border-radius: var(--radius); background: #fff; }
  .count { font-weight: 700; margin: 4px 0 10px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: var(--text); border: 1px solid #d5d8e0;
         border-radius: var(--radius); padding: 0 16px; min-height: 42px; font: inherit; font-size: 15px; cursor: pointer; }
  .btn:active { border-color: var(--accent); color: var(--accent); }
  .radio { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
  .radio label { display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; cursor: pointer; }
  .radio input { width: 18px; height: 18px; accent-color: var(--accent); }
  /* table */
  .tablewrap { overflow: auto; max-height: 420px; border: 1px solid var(--line); border-radius: var(--radius);
               -webkit-overflow-scrolling: touch; margin: 10px 0 6px; }
  table { border-collapse: separate; border-spacing: 0; font-size: 13px; width: max-content; min-width: 100%; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
           text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: #f8f9fb; font-weight: 600; z-index: 2; cursor: pointer; }
  th.sel, td.sel { width: 44px; text-align: center; position: sticky; left: 0; background: #fff; z-index: 1; }
  th.sel { z-index: 3; background: #f8f9fb; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.blank { color: #b0b3bc; }
  tr.picked td { background: var(--sel); }
  tr.picked td.sel { background: var(--sel); }
  tbody tr { cursor: pointer; }
  td.sel input { width: 18px; height: 18px; accent-color: var(--accent); }
  .colhelp { font-size: 13px; color: var(--muted); min-height: 20px; }
  .printed { background: #f8f9fb; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin: 12px 0; }
  .printed h3 { font-size: 15px; margin: 0 0 6px; }
  .printed .tablewrap { max-height: none; margin: 6px 0 0; background: #fff; }
  .info { background: #e8f2fd; color: #0b4a8b; border-radius: var(--radius); padding: 12px 14px; font-size: 14px; }
  /* plot */
  .plot { position: relative; margin-top: 18px; }
  .plot svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .plot circle { cursor: pointer; }
  .tip { position: absolute; background: #fff; border: 1px solid #cfd3dc; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
         font-size: 12px; padding: 6px 8px; pointer-events: none; display: none; max-width: 240px; z-index: 5; }
  .tip table { font-size: 12px; min-width: 0; }
  .tip td { border: none; padding: 1px 6px 1px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin: 6px 0; }
  .legend span.sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  a { color: #1c64d6; }
  /* phone: the filter panel becomes a collapsible panel above the page */
  @media (max-width: 760px) {
    .shell { display: block; }
    main { padding: 14px 14px 50px; }
    h1 { font-size: 26px; }
    aside { width: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 0 14px; }
    .filters-toggle { display: flex; width: 100%; justify-content: space-between; align-items: center;
                      background: none; border: none; font: inherit; font-size: 16px; font-weight: 600; color: var(--text);
                      min-height: 48px; padding: 0; cursor: pointer; }
    aside .panel { display: none; padding-bottom: 16px; }
    aside.open .panel { display: block; }
    aside .panel h2 { display: none; }
    .tablewrap { max-height: 360px; }
  }
</style>
</head>
<body>
<div class="banner">Preview with made-up data -- style and layout only</div>
<div class="shell">
  <aside id="side">
    <button class="filters-toggle" id="toggle" aria-expanded="false"><span>Filters <span id="toggleCount" style="font-weight:400;color:var(--muted)"></span></span><span id="caret">&#9662;</span></button>
    <div class="panel">
      <h2>Filters</h2>
      <div class="tabname" id="sideTab"></div>
      <div id="filters"></div>
    </div>
  </aside>
  <main>
    <h1>AquaSolDB viewer</h1>
    <div class="caption">Read-only view of sample-data/ (made up). Solubility in mol per kg of water; temperature in K;
      pressure in MPa (total pressure unless the pressure basis says otherwise).</div>
    <nav class="tabs" id="tabs"></nav>
    <section id="body"></section>
  </main>
</div>

<script>
"use strict";
// ---------- made-up sample data (never real data, never real DOIs) ----------
const SOURCES = [
  {source_id: "sample2001", reference: "Sample, A. (2001) Gas solubility in salt water at moderate pressure. Journal of Example Data 1, 1-10.", source_type: "journal", doi: "10.0000/example.0001", method: "analytical_sampling"},
  {source_id: "example2010", reference: "Example, B., Placeholder, C. (2010) Phase behaviour of light gases with brines. Example Fluids 22, 100-112.", source_type: "journal", doi: "10.0000/example.0002", method: "manometric_volumetric"},
  {source_id: "demo2015", reference: "Demo, D., Mock, E., Sample, F. (2015) A small sample compilation of gas-water data. Sample Compilations 3, 45-60.", source_type: "compilation", doi: "10.0000/example.0003", method: "calculated_compilation"},
  {source_id: "mock1998", reference: "Mock, G. (1998) Hydrate and dew points of wet gases. PhD thesis, University of Example.", source_type: "thesis", doi: "", method: "synthetic_visual"},
];
const REASON = {
  measured: "read from the source's data table",
  calculated: "computed by the source from its own model",
  no_value: "the source gives no number for this row",
};
const ION = {none: {}, NaCl: {m_Na: 1, m_Cl: 1}, CaCl2: {m_Ca: 1, m_Cl: 2}, not_stated: {}};
const seq = {};
function pid(gas, src) {
  const k = gas + "_" + src; seq[k] = (seq[k] || 0) + 1;
  return gas + "_" + src + "_" + gas.toLowerCase() + "_" + String(seq[k]).padStart(3, "0");
}
function salted(row, salt, m, cols) {
  row.salt = salt;
  row.salt_molality = (salt === "none" || salt === "not_stated" || m === "") ? (salt === "none" ? "0" : "") : String(m);
  if (cols.includes("salt_composition")) row.salt_composition = salt === "none" ? "" : (salt === "not_stated" ? "" : salt + " only");
  for (const ion of ["m_Na", "m_Cl", "m_K", "m_Ca", "m_Mg", "m_SO4"]) {
    if (!cols.includes(ion)) continue;
    const f = (ION[salt] || {})[ion];
    row[ion] = f && m !== "" ? String(+(f * m).toFixed(3)) : (salt === "none" ? "0" : "");
  }
}
function fill(cols, row) { const o = {}; for (const c of cols) o[c] = row[c] === undefined ? "" : String(row[c]); return o; }

const COLS = {
  solubility: ["point_id","gas","temperature_K","pressure_MPa","pressure_basis","salt","salt_molality","salt_composition",
    "m_Na","m_Cl","m_K","m_Ca","m_Mg","m_SO4","solubility_mol_per_kgw","status","status_reason","flags","method","source_id"],
  water_content: ["point_id","gas","phase","temperature_K","pressure_MPa","salt","salt_molality","salt_composition",
    "water_mole_fraction","status","status_reason","flags","method","source_id"],
  mixtures: ["point_id","gas","gas2","gas2_mole_fraction_feed","temperature_K","pressure_MPa","salt","salt_molality",
    "salt_composition","m_Na","m_Cl","m_Ca","solubility_mol_per_kgw","status","status_reason","flags","method","source_id"],
  phase_boundaries: ["point_id","gas","boundary_type","temperature_K","pressure_MPa","salt","salt_molality","m_Na","m_Cl",
    "m_Ca","extra_value","extra_quantity","status","status_reason","flags","method","source_id"],
  other_quantities: ["point_id","source_table","gas","gas2","gas2_mole_fraction_feed","phase","temperature_K","pressure_MPa",
    "pressure_basis","salt","salt_molality","salt_composition","m_Na","m_Cl","m_K","m_Ca","quantity_as_printed",
    "value_as_printed","status","status_reason","flags","method","source_id"],
};
const SRC_METHOD = Object.fromEntries(SOURCES.map(s => [s.source_id, s.method]));
const PRINTED = [];
function addPrinted(id, value, unit, page) {
  PRINTED.push({point_id: id, value_as_printed: value, unit_as_printed: unit, page_ref: page,
                page_ref_convention: page.startsWith("p. ") ? "printed_page" : "pdf_page", page_offset: page.startsWith("p. ") ? "0" : "-2"});
}
function make(table, spec) {
  return spec.map(r => {
    const row = Object.assign({}, r);
    row.point_id = pid(r.gas, r.source_id);
    salted(row, r.salt, r.m, COLS[table]);
    row.status_reason = REASON[r.status];
    row.method = r.method || SRC_METHOD[r.source_id];
    if (row.flags === undefined) row.flags = "";
    if (r.printed) addPrinted(row.point_id, r.printed[0], r.printed[1], r.printed[2]);
    return fill(COLS[table], row);
  });
}

const TABLES = {};
TABLES.solubility = make("solubility", [
  {gas:"CO2", temperature_K:"323.15", pressure_MPa:"5.00",  pressure_basis:"total", salt:"none",  m:0,   solubility_mol_per_kgw:"0.800", status:"measured", source_id:"sample2001", printed:["0.0142","mole fraction","p. 4"]},
  {gas:"CO2", temperature_K:"323.15", pressure_MPa:"10.00", pressure_basis:"total", salt:"none",  m:0,   solubility_mol_per_kgw:"1.100", status:"measured", source_id:"sample2001", printed:["0.0194","mole fraction","p. 4"]},
  {gas:"CO2", temperature_K:"323.15", pressure_MPa:"15.00", pressure_basis:"total", salt:"NaCl",  m:1.0, solubility_mol_per_kgw:"0.950", status:"measured", source_id:"sample2001", printed:["0.950","mol/kg","p. 5"]},
  {gas:"CO2", temperature_K:"353.15", pressure_MPa:"10.00", pressure_basis:"total", salt:"CaCl2", m:0.5, solubility_mol_per_kgw:"0.700", status:"measured", flags:"replicate", source_id:"example2010", printed:["0.70","mol/kg","Table 2, p. 104"]},
  {gas:"H2",  temperature_K:"298.15", pressure_MPa:"5.00",  pressure_basis:"total", salt:"none",  m:0,   solubility_mol_per_kgw:"0.040", status:"measured", source_id:"example2010", printed:["0.040","mol/kg","Table 1, p. 103"]},
  {gas:"H2",  temperature_K:"298.15", pressure_MPa:"10.00", pressure_basis:"total", salt:"none",  m:0,   solubility_mol_per_kgw:"0.078", status:"measured", source_id:"example2010", printed:["0.078","mol/kg","Table 1, p. 103"]},
  {gas:"H2",  temperature_K:"323.15", pressure_MPa:"20.00", pressure_basis:"total", salt:"NaCl",  m:2.0, solubility_mol_per_kgw:"0.090", status:"measured", source_id:"sample2001", printed:["1.6e-3","mole fraction","p. 6"]},
  {gas:"CH4", temperature_K:"310.00", pressure_MPa:"8.00",  pressure_basis:"total", salt:"none",  m:0,   solubility_mol_per_kgw:"0.090", status:"calculated", flags:"from_compilation", source_id:"demo2015", printed:["0.090","mol/kg","pdf 12"]},
  {gas:"CH4", temperature_K:"340.00", pressure_MPa:"12.00", pressure_basis:"total", salt:"NaCl",  m:1.0, solubility_mol_per_kgw:"0.085", status:"calculated", flags:"from_compilation", source_id:"demo2015", printed:["0.085","mol/kg","pdf 12"]},
  {gas:"N2",  temperature_K:"300.00", pressure_MPa:"10.00", pressure_basis:"total", salt:"not_stated", m:"", solubility_mol_per_kgw:"0.060", status:"measured", flags:"suspect_value", source_id:"demo2015", printed:["0.060","mol/kg","pdf 14"]},
  {gas:"H2S", temperature_K:"330.00", pressure_MPa:"2.00",  pressure_basis:"partial_H2S", salt:"none", m:0, solubility_mol_per_kgw:"0.450", status:"measured", source_id:"sample2001", printed:["0.45","mol/kg","p. 7"]},
  {gas:"C2H6",temperature_K:"320.00", pressure_MPa:"",      pressure_basis:"total", salt:"none",  m:0,   solubility_mol_per_kgw:"0.030", status:"measured", flags:"digitized_from_figure", source_id:"example2010", printed:["0.03","mol/kg","Fig. 3, p. 107"]},
  {gas:"CO2", temperature_K:"373.15", pressure_MPa:"20.00", pressure_basis:"total", salt:"NaCl",  m:3.0, solubility_mol_per_kgw:"",      status:"no_value", source_id:"demo2015", printed:["--","","pdf 15"]},
]);
TABLES.water_content = make("water_content", [
  {gas:"CO2", phase:"vapour", temperature_K:"323.15", pressure_MPa:"5.00",  salt:"none", m:0, water_mole_fraction:"0.0040", status:"measured", source_id:"sample2001", printed:["4.0e-3","mole fraction","p. 8"]},
  {gas:"CO2", phase:"vapour", temperature_K:"323.15", pressure_MPa:"10.00", salt:"none", m:0, water_mole_fraction:"0.0030", status:"measured", source_id:"sample2001", printed:["3.0e-3","mole fraction","p. 8"]},
  {gas:"CO2", phase:"liquid_hydrocarbon_or_co2", temperature_K:"298.15", pressure_MPa:"8.00", salt:"none", m:0, water_mole_fraction:"0.0025", status:"measured", source_id:"example2010", printed:["0.25","mol %","Table 4, p. 109"]},
  {gas:"CH4", phase:"vapour", temperature_K:"310.00", pressure_MPa:"10.00", salt:"NaCl", m:1.0, water_mole_fraction:"0.0012", status:"measured", source_id:"mock1998", printed:["1.2e-3","mole fraction","pdf 40"]},
  {gas:"CH4", phase:"vapour", temperature_K:"340.00", pressure_MPa:"10.00", salt:"not_stated", m:"", water_mole_fraction:"0.0035", status:"calculated", flags:"from_compilation", source_id:"demo2015", printed:["3.5e-3","mole fraction","pdf 20"]},
  {gas:"N2",  phase:"vapour", temperature_K:"300.00", pressure_MPa:"5.00",  salt:"none", m:0, water_mole_fraction:"0.0009", status:"measured", source_id:"mock1998", printed:["9e-4","mole fraction","pdf 41"]},
  {gas:"H2",  phase:"vapour", temperature_K:"323.15", pressure_MPa:"10.00", salt:"none", m:0, water_mole_fraction:"0.0015", status:"measured", source_id:"example2010", printed:["0.15","mol %","Table 5, p. 110"]},
  {gas:"H2S", phase:"vapour", temperature_K:"350.00", pressure_MPa:"",      salt:"none", m:0, water_mole_fraction:"",       status:"no_value", source_id:"demo2015", printed:["n.d.","","pdf 21"]},
]);
TABLES.mixtures = make("mixtures", [
  {gas:"CO2", gas2:"H2",  gas2_mole_fraction_feed:"0.10", temperature_K:"323.15", pressure_MPa:"10.00", salt:"none", m:0,   solubility_mol_per_kgw:"0.950", status:"measured", source_id:"example2010", printed:["0.95","mol/kg","Table 6, p. 111"]},
  {gas:"H2",  gas2:"CO2", gas2_mole_fraction_feed:"0.90", temperature_K:"323.15", pressure_MPa:"10.00", salt:"none", m:0,   solubility_mol_per_kgw:"0.008", status:"measured", source_id:"example2010", printed:["0.008","mol/kg","Table 6, p. 111"]},
  {gas:"CH4", gas2:"CO2", gas2_mole_fraction_feed:"0.20", temperature_K:"340.00", pressure_MPa:"15.00", salt:"NaCl", m:1.0, solubility_mol_per_kgw:"0.070", status:"measured", source_id:"sample2001", printed:["0.070","mol/kg","p. 9"]},
  {gas:"CO2", gas2:"CH4", gas2_mole_fraction_feed:"0.80", temperature_K:"340.00", pressure_MPa:"15.00", salt:"NaCl", m:1.0, solubility_mol_per_kgw:"0.210", status:"measured", source_id:"sample2001", printed:["0.21","mol/kg","p. 9"]},
  {gas:"N2",  gas2:"CH4", gas2_mole_fraction_feed:"0.50", temperature_K:"310.00", pressure_MPa:"20.00", salt:"CaCl2", m:1.0, solubility_mol_per_kgw:"0.040", status:"calculated", flags:"from_compilation", source_id:"demo2015", printed:["0.040","mol/kg","pdf 30"]},
  {gas:"CH4", gas2:"N2",  gas2_mole_fraction_feed:"0.50", temperature_K:"310.00", pressure_MPa:"20.00", salt:"CaCl2", m:1.0, solubility_mol_per_kgw:"0.055", status:"calculated", flags:"from_compilation", source_id:"demo2015", printed:["0.055","mol/kg","pdf 30"]},
]);
TABLES.phase_boundaries = make("phase_boundaries", [
  {gas:"CH4", boundary_type:"hydrate",     temperature_K:"280.00", pressure_MPa:"5.00",  salt:"none", m:0,   extra_value:"", extra_quantity:"", status:"measured", source_id:"mock1998", printed:["5.0","MPa","pdf 52"]},
  {gas:"CH4", boundary_type:"hydrate",     temperature_K:"285.00", pressure_MPa:"8.50",  salt:"NaCl", m:1.0, extra_value:"", extra_quantity:"", status:"measured", source_id:"mock1998", printed:["8.5","MPa","pdf 52"]},
  {gas:"CO2", boundary_type:"hydrate",     temperature_K:"278.00", pressure_MPa:"2.50",  salt:"none", m:0,   extra_value:"", extra_quantity:"", status:"measured", source_id:"mock1998", printed:["25","bar","pdf 53"]},
  {gas:"CO2", boundary_type:"three_phase", temperature_K:"290.00", pressure_MPa:"5.20",  salt:"none", m:0,   extra_value:"0.025", extra_quantity:"water mole fraction in liquid CO2", status:"measured", source_id:"example2010", printed:["5.2","MPa","Table 7, p. 112"]},
  {gas:"C2H6",boundary_type:"dew_point",   temperature_K:"300.00", pressure_MPa:"3.00",  salt:"none", m:0,   extra_value:"", extra_quantity:"", status:"measured", source_id:"mock1998", printed:["3.0","MPa","pdf 60"]},
  {gas:"N2",  boundary_type:"",            temperature_K:"283.00", pressure_MPa:"15.00", salt:"not_stated", m:"", extra_value:"", extra_quantity:"", status:"calculated", flags:"from_compilation", source_id:"demo2015", printed:["150","bar","pdf 33"]},
]);
TABLES.other_quantities = make("other_quantities", [
  {source_table:"Table 3", gas:"CO2", gas2:"", gas2_mole_fraction_feed:"", phase:"", temperature_K:"323.15", pressure_MPa:"10.00", pressure_basis:"total", salt:"none", m:0, quantity_as_printed:"Gas-water ratio, m3/m3 (sample)", value_as_printed:"24.0", status:"measured", source_id:"sample2001", printed:["24.0","m3/m3","p. 10"]},
  {source_table:"Table 3", gas:"CH4", gas2:"", gas2_mole_fraction_feed:"", phase:"", temperature_K:"340.00", pressure_MPa:"12.00", pressure_basis:"total", salt:"NaCl", m:1.0, quantity_as_printed:"Henry constant, MPa (sample)", value_as_printed:"5200", status:"calculated", source_id:"demo2015", printed:["5200","MPa","pdf 40"]},

// ---------- state ----------
const state = {tab: "solubility", f: {}, picked: {}, joined: {}, axis: {}, src: {text: "", methods: []}};
function filtersFor(key) {
  if (!state.f[key]) {
    const rows = TABLES[key];
    const f = {gas: [], salt: [], source_id: [], status: [], phase: []};
    for (const c of ["temperature_K", "pressure_MPa"]) {
      const v = rows.map(r => num(r[c])).filter(x => !isNaN(x));
      f[c] = v.length ? {lo: Math.min(...v), hi: Math.max(...v), min: Math.min(...v), max: Math.max(...v),
                         blank: rows.some(r => isNaN(num(r[c]))), keepBlank: true} : null;
    }
    state.f[key] = f;
  }
  return state.f[key];
}
function filtered(key) {
  const f = filtersFor(key), rows = TABLES[key];
  return rows.filter(r => {
    for (const c of ["gas","salt","source_id","status","phase"])
      if (f[c].length && c in r && !f[c].includes(r[c])) return false;
    for (const c of ["temperature_K","pressure_MPa"]) {
      const g = f[c]; if (!g) continue;
      const v = num(r[c]);
      if (isNaN(v)) { if (!g.keepBlank) return false; }

}

// ---------- tables ----------
function tableHTML(rows, cols, table, opts = {}) {
  const head = (opts.select ? `<th class="sel" aria-label="pick"></th>` : "") +
    cols.map(c => `<th data-colhelp="${esc(table)}|${esc(c)}">${esc(opts.rawHeads ? c : (opts.heads?.[c] || label(c)))}</th>`).join("");
  const body = rows.map((r, i) => {
    const picked = opts.select && opts.pickedId === r.point_id;
    return `<tr${picked ? ' class="picked"' : ""}${opts.select ? ` data-pick="${esc(r.point_id)}"` : ""}>` +
      (opts.select ? `<td class="sel"><input type="radio" name="pick_${table}" ${picked ? "checked" : ""} aria-label="pick row"></td>` : "") +
      cols.map(c => {
        const v = r[c] ?? "";
        if (c === "doi" && v) return `<td><a href="https://doi.org/${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a></td>`;
        if (v === "") return `<td class="blank">${NUMERIC.has(c) ? "None" : ""}</td>`;
        return `<td class="${NUMERIC.has(c) || opts.numCols?.includes(c) ? "num" : ""}">${esc(v)}</td>`;
      }).join("") + "</tr>";
  }).join("");
  return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const PRINTED_COLS = ["point_id","value_as_printed","unit_as_printed","page_ref","page_ref_convention","page_offset"];
function withPrinted(rows, cols) {
  const extra = PRINTED_COLS.filter(c => c !== "point_id" && !cols.includes(c));
  return {cols: cols.concat(extra), rows: rows.map(r => Object.assign({}, Object.fromEntries(extra.map(c => [c, ""])),
          PRINTED.find(p => p.point_id === r.point_id) ? Object.fromEntries(extra.map(c => [c, PRINTED.find(p => p.point_id === r.point_id)[c]])) : {}, r))};
}

function renderMeasurement(key) {

// ---------- plot (inline SVG) ----------
function niceTicks(lo, hi, n) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const t = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-12; v += step) t.push(+v.toPrecision(10));
  return {ticks: t, step};
}
function plotHTML(key, rows) {
  const y = PLOT_QUANTITY[key], axis = state.axis[key] || "pressure_MPa";
  let h = `<div class="field" style="margin-top:22px"><div class="lbl">Plot against</div><div class="radio">
    <label><input type="radio" name="axis" value="pressure_MPa" ${axis === "pressure_MPa" ? "checked" : ""}> Pressure (MPa)</label>
    <label><input type="radio" name="axis" value="temperature_K" ${axis === "temperature_K" ? "checked" : ""}> Temperature (K)</label></div></div>`;
  const pts = rows.filter(r => !isNaN(num(r[axis])) && !isNaN(num(r[y])));
  if (!pts.length) return h + `<div class="info">No plottable rows for these filters.</div>`;
  const W = 640, H = 380, L = 64, R = 14, T = 14, B = 52;
  const xs = pts.map(r => num(r[axis])), ys = pts.map(r => num(r[y]));
  const pad = (a, b) => { const d = (b - a) || Math.abs(a) || 1; return [a - 0.06 * d, b + 0.06 * d]; };
  const [x0, x1] = pad(Math.min(...xs), Math.max(...xs)), [y0, y1] = pad(Math.min(...ys), Math.max(...ys));
  const sx = v => L + (v - x0) / (x1 - x0) * (W - L - R), sy = v => H - B - (v - y0) / (y1 - y0) * (H - T - B);
  const xt = niceTicks(x0, x1, 6).ticks.filter(v => v >= x0 && v <= x1), yt = niceTicks(y0, y1, 6).ticks.filter(v => v >= y0 && v <= y1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label(y))} against ${esc(label(axis))}" font-family="inherit" font-size="12">`;
  s += yt.map(v => `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#eceef2"/><text x="${L - 8}" y="${sy(v) + 4}" text-anchor="end" fill="#6b6f7b">${v}</text>`).join("");
  s += xt.map(v => `<line y1="${T}" y2="${H - B}" x1="${sx(v)}" x2="${sx(v)}" stroke="#eceef2"/><text y="${H - B + 18}" x="${sx(v)}" text-anchor="middle" fill="#6b6f7b">${v}</text>`).join("");
  s += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="#888"/><line x1="${L}" x2="${L}" y1="${T}" y2="${H - B}" stroke="#888"/>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 10}" text-anchor="middle" font-weight="600" fill="#31333f">${esc(label(axis))}</text>`;
  s += `<text transform="translate(16 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" font-weight="600" fill="#31333f">${esc(label(y))}</text>`;
  s += pts.map((r, i) => `<circle data-pt="${i}" cx="${sx(xs[i]).toFixed(1)}" cy="${sy(ys[i]).toFixed(1)}" r="7" fill="${SRC_COLOR[r.source_id]}" fill-opacity="0.78" stroke="#fff" stroke-width="1.2"/>`).join("");
  s += `</svg>`;
  const used = distinct(pts, "source_id");
  h += `<div class="lbl" style="font-size:13px;font-weight:600;margin-top:4px">Source</div><div class="legend">${used.map(u => `<span><span class="sw" style="background:${SRC_COLOR[u]}"></span>${esc(u)}</span>`).join("")}</div>`;
  h += `<div class="plot" id="plot">${s}<div class="tip" id="tip"></div></div>`;
  h += `<div class="caption">${pts.length.toLocaleString()} points plotted, coloured by source. Tap a point for its values.</div>`;
  plotPts = pts.map(r => {
    const tipCols = ["point_id","source_id","gas","salt","salt_molality","temperature_K","pressure_MPa", y].filter(c => c in r);
    return [...new Set(tipCols)].map(c => [label(c), r[c] === "" ? "None" : r[c]]);
  });
  return h;
}
let plotPts = [];
function showTip(el) {
  const tip = document.getElementById("tip"), box = document.getElementById("plot");

  const i = +el.dataset.pt;
  tip.innerHTML = `<table>${plotPts[i].map(([k, v]) => `<tr><td style="color:#6b6f7b">${esc(k)}</td><td><b>${esc(v)}</b></td></tr>`).join("")}</table>`;

  }
  const mchip = t.closest(".chip[data-method]");
  if (mchip) { const m = state.src.methods, v = mchip.dataset.method, i = m.indexOf(v); i >= 0 ? m.splice(i, 1) : m.push(v); render(); return; }
  const help = t.closest("[data-help]");
  if (help) { document.getElementById(help.dataset.help).classList.toggle("open"); return; }
  if (t.closest("#toggle")) {
    const side = document.getElementById("side"), open = side.classList.toggle("open");
    document.getElementById("toggle").setAttribute("aria-expanded", open);
    document.getElementById("caret").innerHTML = open ? "&#9652;" : "&#9662;"; return;
  }
  if (t.closest("#dl")) {
    const key = state.tab; download(key + "_selection.csv", toCSV(filtered(key), COLS[key])); return;
  }
  if (t.closest("#dlsrc")) {
    const keep = new Set([...document.querySelectorAll("#body tbody tr")].map(tr => tr.children[0].textContent));
    download("sources_selection.csv", toCSV(SOURCES.filter(s => keep.has(s.source_id)), ["source_id","reference","source_type","doi","method"])); return;
  }
  const th = t.closest("th[data-colhelp]");
  if (th) {
    const [table, col] = th.dataset.colhelp.split("|"), box = document.getElementById("colhelp");
    const key = table === "sources" ? "sources" : table;
    if (box) box.textContent = label(col) + ": " + (helpFor(key, col) || (col.startsWith("rows_") ? "How many rows that table holds for this source." : "No meaning recorded."));
    return;
  }
  const tr = t.closest("tr[data-pick]");
  if (tr && !t.closest("a")) { const k = state.tab; state.picked[k] = state.picked[k] === tr.dataset.pick && t.type !== "radio" ? null : tr.dataset.pick; render(); return; }
  const pt = t.closest("circle[data-pt]");
  if (pt) { showTip(pt); return; }
  if (!t.closest(".tip")) { const tip = document.getElementById("tip"); if (tip) tip.style.display = "none"; }
});
document.addEventListener("mouseover", e => { const pt = e.target.closest?.("circle[data-pt]"); if (pt) showTip(pt); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.range) {
    const g = filtersFor(state.tab)[t.dataset.range], v = +t.value;
    if (t.dataset.end === "lo") g.lo = Math.min(v, g.hi); else g.hi = Math.max(v, g.lo);
    t.value = g[t.dataset.end]; t.nextElementSibling.textContent = (+t.value).toFixed(2);
    document.getElementById("body").innerHTML = renderMeasurement(state.tab);
    return;
  }
  if (t.id === "srcText") { state.src.text = t.value; document.getElementById("body").innerHTML = renderSources(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.blank) { filtersFor(state.tab)[t.dataset.blank].keepBlank = t.checked; render(); return; }
  if (t.id === "join") { state.joined[state.tab] = t.checked; render(); return; }
  if (t.name === "axis") { state.axis[state.tab] = t.value; render(); return; }
});
render();
</script>
</body>
</html>
